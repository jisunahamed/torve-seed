appId: com.torveai.desktop
productName: Torve Desktop
executableName: Torve Desktop
copyright: Copyright © 2025-2026 Torve
electronVersion: 31.7.7
npmRebuild: false

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - assets/**/*
  - package.json
  - node_modules/@torveai/**/*
  - "!node_modules/@torveai/**/src/**"
  - "!node_modules/@torveai/**/node_modules/**"
  - "!**/*.map"
  - "!**/*.js.map"
  - "!**/*.css.map"
  - "!**/*.d.ts"
  - "!**/*.d.ts.map"
  - "!**/*.ts"
  - "!src/**"
  - "!tests/**"
  - "!node_modules/koffi/build/koffi/linux*"
  - "!node_modules/koffi/build/koffi/win32*"
  - "!node_modules/koffi/build/koffi/freebsd*"
  - "!node_modules/koffi/build/koffi/openbsd*"
  - "!node_modules/koffi/build/koffi/musl*"
  - "!node_modules/**/*.map"
  - "!node_modules/**/*.d.ts"
  - "!node_modules/**/*.d.mts"
  - "!node_modules/**/*.d.cts"
  - "!node_modules/@rollup/rollup-*/**"

extraMetadata:
  main: dist/main/main.js

asar: true
asarUnpack:
  - "node_modules/**/*.node"
  - "node_modules/better-sqlite3/**"
  - "node_modules/bindings/**"
  - "node_modules/file-uri-to-path/**"

extraResources:
  - from: build/system-proxy-profiles.json
    to: system-proxy-profiles.json

beforePack: ./scripts/before-pack.js
afterPack: ./scripts/after-pack-harden.mjs

mac:
  category: public.app-category.developer-tools
  icon: assets/torve-dock-icon.png
  identity: "Shahaf Antwarg (H3M5BXXQR2)"
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  target:
    - target: dmg
    - target: zip

dmg:
  title: "${productName} ${version}"

win:
  icon: assets/torve-icon.ico
  sign: ./scripts/win-sign.cjs
  signingHashAlgorithms:
    - sha256
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: true
  perMachine: true
  allowToChangeInstallationDirectory: false
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  artifactName: "Torve-Desktop-Setup-${version}.${ext}"
  installerIcon: assets/torve-icon.ico
  uninstallerIcon: assets/torve-icon.ico
  shortcutName: Torve Desktop

linux:
  icon: assets/torve-dock-icon.png
  category: Development
  artifactName: "${productName}-${version}-${arch}.${ext}"
  target:
    - target: AppImage
    - target: deb

publish:
  provider: github
  owner: jisunahamed
  repo: torve-seed
